[project]
name = "ajaia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
